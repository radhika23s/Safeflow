    name: safeflow-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        value: mongodb+srv://digvijayb044:dbmongo@cluster0.iwjg1gh.mongodb.net/banking_system?retryWrites=true&w=majority
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
